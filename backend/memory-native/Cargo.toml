[package]
name = "wordprism-memory"
version = "0.4.0"
edition = "2024"
publish = false

[lib]
name = "wordprism_memory"
crate-type = ["cdylib", "rlib"]

[dependencies]
fsrs = "=6.6.2"
jni = "=0.21.1"
rayon = "=1.12.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"
