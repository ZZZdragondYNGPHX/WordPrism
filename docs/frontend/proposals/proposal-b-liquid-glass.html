<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WordPrism · 方案 B：Bento Workbench & Split-Stage</title>
  <script src="https://www.gstatic.com/antigravity/web/dev/tailwindcss.min.js"></script>
  <style>
    :root {
      --sf-sans: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "PingFang SC", system-ui, sans-serif;
      --sf-mono: "SF Mono", ui-monospace, Menlo, Monaco, Consolas, monospace;
      --spring: cubic-bezier(0.22, 1, 0.36, 1);
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body { font-family: var(--sf-sans); margin: 0; padding: 0; -webkit-font-smoothing: antialiased; }
    .tabular-nums { font-variant-numeric: tabular-nums; }
    .font-mono-prism { font-family: var(--sf-mono); font-variant-ligatures: none; }
    .ios-scroll { overflow-y: auto; scrollbar-width: none; }
    .ios-scroll::-webkit-scrollbar { display: none; }
    .ios-press { transition: transform 0.22s var(--spring); cursor: pointer; }
    .ios-press:active { transform: scale(0.965); }

    .paradigm-b {
      --bg: #EBF0FC;
      --stage-top: rgba(255,255,255,0.72);
      --tile: rgba(255,255,255,0.74);
      --tile-solid: #FFFFFF;
      --sunk: rgba(110,120,165,0.12);
      --ink: #101324;
      --muted: #585D75;
      --subtle: #8F95AD;
      --hairline: rgba(255,255,255,0.85);
      --line: rgba(20,30,70,0.08);
      --action: #2D5BFF;
      --action-soft: rgba(45,91,255,0.13);
      --ai: #6D3BFF;
      --ai-soft: rgba(109,59,255,0.13);
      --ok: #10B981;
      --ok-soft: rgba(16,185,129,0.14);
      --err: #F43F5E;
      --err-soft: rgba(244,63,94,0.14);
      --warn: #F59E0B;
      --sp-0: #F43F5E; --sp-1: #F59E0B; --sp-2: #10B981; --sp-3: #2563EB;
    }
    .paradigm-b.dark {
      --bg: #070913;
      --stage-top: rgba(24,28,48,0.74);
      --tile: rgba(28,32,54,0.68);
      --tile-solid: #171A2B;
      --sunk: rgba(255,255,255,0.08);
      --ink: #F5F7FF;
      --muted: #9BA2C0;
      --subtle: #646B8A;
      --hairline: rgba(255,255,255,0.16);
      --line: rgba(255,255,255,0.10);
      --action: #6B8AFF;
      --action-soft: rgba(107,138,255,0.22);
      --ai: #A88BFF;
      --ai-soft: rgba(168,139,255,0.22);
      --ok: #34D399;
      --ok-soft: rgba(52,211,153,0.18);
      --err: #FB7185;
      --err-soft: rgba(251,113,133,0.18);
      --warn: #FBBF24;
      --sp-0: #FB7185; --sp-1: #FBBF24; --sp-2: #34D399; --sp-3: #60A5FA;
    }

    .device-shell {
      padding: 12px;
      border-radius: 64px;
      background: linear-gradient(145deg, #2d2d32, #18181b 48%, #27272c);
      box-shadow: 0 36px 80px -20px rgba(0,0,0,0.42), 0 0 0 1px rgba(255,255,255,0.14) inset;
    }
    .phone-frame {
      position: relative;
      width: 393px;
      height: 852px;
      border-radius: 54px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      background: var(--bg);
      color: var(--ink);
    }

    .bento-tile {
      background: var(--tile);
      backdrop-filter: blur(24px) saturate(180%);
      -webkit-backdrop-filter: blur(24px) saturate(180%);
      border-radius: 24px;
      border: 1px solid var(--hairline);
      box-shadow: 0 10px 28px -8px rgba(32,48,110,0.10);
    }

    /* Split Stage Upper Optical Mask */
    .diff-char-masked {
      filter: blur(6px);
      opacity: 0.35;
      transition: all 0.45s var(--spring);
    }
    .diff-char-revealed {
      filter: blur(0);
      opacity: 1;
      transition: all 0.45s var(--spring);
    }
    .prism-cell {
      display: inline-flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 22px;
      height: 36px;
      font-family: var(--sf-mono);
      font-size: 22px;
      font-weight: 600;
      position: relative;
    }
    .prism-beam {
      background: linear-gradient(180deg, transparent 0%, var(--action-soft) 50%, transparent 100%);
    }
    .prism-glow-line {
      position: absolute;
      bottom: 2px; left: 3px; right: 3px;
      height: 2.5px; border-radius: 99px;
      box-shadow: 0 0 8px currentColor;
    }
  </style>
</head>
<body class="bg-[var(--background)] text-[var(--foreground)] min-h-screen flex flex-col items-center py-6 px-4 gap-4">
  <div class="w-full max-w-md flex items-center justify-between px-2">
    <div>
      <span class="text-xs font-semibold px-2.5 py-0.5 rounded-full bg-indigo-500/10 text-indigo-600">方案 B · Bento Workbench & Split-Stage</span>
      <p class="text-xs text-[var(--muted-foreground)] mt-1">零滚动磁贴工作台 + 上半屏恒定棱镜仪器 / 下半屏拇指热区双舞台</p>
    </div>
    <button onclick="dark=!dark;render()" class="px-3 py-1.5 rounded-xl text-xs font-medium border border-[var(--border)] bg-[var(--card)] cursor-pointer" id="dark-btn">☀️ 浅色</button>
  </div>

  <div id="mount"></div>

  <script>
    let dark = false;
    let route = 'bento';     // 'bento' | 'split-study' | 'grid-library' | 'health-analytics'
    let autopilot = true;
    let carouselIdx = 0;
    let maskedMode = true;   // Split-Stage upper optical mask state
    let splitPicked = null;
    let splitStep = 'choice'; // 'choice' | 'production'
    let selectedHeatDay = 6;

    const PAIR_CAROUSEL = [
      {
        title: 'linear / liner',
        members: [
          { lemma: 'linear', diffs: [4,5], gloss: 'adj. 线性的' },
          { lemma: 'liner ', diffs: [4], gloss: 'n. 衬里；邮轮' }
        ],
        stem: 'The chart shows a ______ growth curve.',
        answer: 'linear',
        options: ['linear', 'liner', 'lineage', 'linen'],
        tip: '-ar 为形容词后缀，-er 为器物/衬里名词。'
      },
      {
        title: 'adapt / adopt',
        members: [
          { lemma: 'adapt', diffs: [2], gloss: 'v. 适应' },
          { lemma: 'adopt', diffs: [2], gloss: 'v. 采用；收养' }
        ],
        stem: 'Teams must ______ quickly to user feedback.',
        answer: 'adapt',
        options: ['adapt', 'adopt', 'adept', 'adult'],
        tip: 'adapt to = 适应（中间字母 a 联想 apt 恰当）。'
      }
    ];

    function render() {
      document.getElementById('dark-btn').textContent = dark ? '🌙 深色' : '☀️ 浅色';
      document.getElementById('mount').innerHTML = `
        <div class="device-shell">
          <div class="phone-frame paradigm-b ${dark ? 'dark' : ''}">
            <!-- Ambient Halo -->
            <div class="absolute inset-0 pointer-events-none overflow-hidden z-0">
              <div class="absolute -top-12 -left-12 w-72 h-72 rounded-full blur-3xl" style="background:radial-gradient(circle, rgba(45,91,255,0.24), transparent 70%);"></div>
              <div class="absolute bottom-10 -right-16 w-72 h-72 rounded-full blur-3xl" style="background:radial-gradient(circle, rgba(109,59,255,0.20), transparent 70%);"></div>
            </div>

            <!-- Status Bar -->
            <div class="relative z-20 pt-3.5 px-7 pb-1 flex items-center justify-between text-[14px] font-semibold">
              <span class="tabular-nums">9:41</span>
              <div class="w-28 h-8 rounded-full bg-black"></div>
              <span class="text-[12px]">5G</span>
            </div>

            ${route === 'split-study' ? renderSplitStage() : renderWorkbenchShell()}
          </div>
        </div>`;
    }

    function renderWorkbenchShell() {
      return `
        <div class="relative z-10 flex-1 flex flex-col px-4 pt-2 pb-4 justify-between overflow-hidden">
          <!-- Top Compact Workbench Nav -->
          <div class="flex items-center justify-between mb-2">
            <div>
              <div class="text-[11px] font-bold uppercase tracking-wider" style="color:var(--action)">WORDPRISM WORKBENCH</div>
              <h1 class="text-[22px] font-bold tracking-tight">${route==='bento'?'今日磁贴矩阵':route==='grid-library'?'光谱双栏词库':'FSRS 健康洞察'}</h1>
            </div>
            <div class="flex gap-1 p-1 rounded-full" style="background:var(--sunk)">
              ${[['bento','矩阵'],['grid-library','词库'],['health-analytics','总览']].map(([r,l])=>`
                <button onclick="route='${r}';render()" class="px-2.5 py-1 rounded-full text-[11px] font-semibold border-0 cursor-pointer"
                  style="${route===r?'background:var(--tile-solid);color:var(--ink);box-shadow:0 1px 4px rgba(0,0,0,0.08);':'background:transparent;color:var(--muted);'}">${l}</button>
              `).join('')}
            </div>
          </div>

          <!-- Center View -->
          <div class="flex-1 ios-scroll">
            ${route === 'bento' ? renderBentoMatrix() : route === 'grid-library' ? renderGridLibrary() : renderHealthAnalytics()}
          </div>
        </div>`;
    }

    // 1. ZERO-SCROLL 2-COLUMN BENTO MATRIX
    function renderBentoMatrix() {
      const pair = PAIR_CAROUSEL[carouselIdx];
      return `
        <div class="grid grid-cols-2 gap-3 pb-2">
          <!-- Tile 1 (Top Left): Fitness Rings -->
          <div onclick="startSplitStudy()" class="ios-press bento-tile p-4 flex flex-col justify-between h-[176px]">
            <div class="flex items-center justify-between">
              <span class="text-[11px] font-bold" style="color:var(--muted)">今日双环</span>
              <span class="text-[11px] font-bold" style="color:var(--action)">开练 ›</span>
            </div>
            <div class="flex items-center justify-center my-1">
              <svg class="w-20 h-20 -rotate-90" viewBox="0 0 80 80">
                <circle cx="40" cy="40" r="32" fill="none" stroke="var(--sunk)" stroke-width="7"/>
                <circle cx="40" cy="40" r="32" fill="none" stroke="var(--action)" stroke-width="7" stroke-linecap="round" stroke-dasharray="201" stroke-dashoffset="105"/>
                <circle cx="40" cy="40" r="22" fill="none" stroke="var(--sunk)" stroke-width="7"/>
                <circle cx="40" cy="40" r="22" fill="none" stroke="var(--ok)" stroke-width="7" stroke-linecap="round" stroke-dasharray="138" stroke-dashoffset="48"/>
              </svg>
            </div>
            <div class="flex justify-between text-[11px] tabular-nums">
              <span><strong>14</strong>/30′</span>
              <span style="color:var(--ok)"><strong>6</strong>/12 题</span>
            </div>
          </div>

          <!-- Tile 2 (Top Right): AI Autopilot Cockpit -->
          <div onclick="autopilot=!autopilot;render()" class="ios-press bento-tile p-4 flex flex-col justify-between h-[176px]">
            <div class="flex items-center justify-between">
              <span class="text-[11px] font-bold" style="color:${autopilot?'var(--ai)':'var(--muted)'}">✦ AI 自动驾驶</span>
              <span class="w-2.5 h-2.5 rounded-full ${autopilot?'bg-indigo-500 animate-pulse':'bg-slate-400'}"></span>
            </div>
            <div>
              <div class="text-[18px] font-bold leading-snug">${autopilot ? '托管已开启' : '手动编排中'}</div>
              <p class="text-[11px] mt-1 leading-relaxed" style="color:var(--muted)">${autopilot ? '助教自动整理词根并生成夜间复习题' : '完全按你自定节奏安排复习'}</p>
            </div>
            <div class="px-2.5 py-1 rounded-full text-[11px] font-semibold text-center" style="background:${autopilot?'var(--ai-soft)':'var(--sunk)'};color:${autopilot?'var(--ai)':'var(--muted)'}">
              点击切换模式
            </div>
          </div>

          <!-- Tile 3 (Full Width): Interactive Mini Prism Carousel -->
          <div class="bento-tile col-span-2 p-4 space-y-3">
            <div class="flex items-center justify-between">
              <span class="text-[11px] font-bold uppercase tracking-wider" style="color:var(--muted)">实时棱镜预览 · ${pair.title}</span>
              <div class="flex gap-1.5">
                <button onclick="carouselIdx=(carouselIdx+1)%2;render()" class="px-2 py-0.5 rounded-full text-[11px] font-semibold border-0 cursor-pointer" style="background:var(--sunk);color:var(--ink)">换一组 ↻</button>
              </div>
            </div>
            <div class="p-3 rounded-2xl space-y-1" style="background:var(--sunk)">
              ${pair.members.map((m, mi) => `
                <div class="flex items-center justify-between">
                  <div>
                    ${m.lemma.split('').map((ch, ci) => {
                      const hl = m.diffs.includes(ci);
                      return `<span class="prism-cell" style="width:18px;height:28px;font-size:19px;color:${hl?`var(--sp-${mi})`:'var(--ink)'}">${ch===' '?'&nbsp;':ch}${hl?`<span class="prism-glow-line" style="background:var(--sp-${mi})"></span>`:''}</span>`;
                    }).join('')}
                  </div>
                  <span class="text-[11px]" style="color:var(--muted)">${m.gloss}</span>
                </div>`).join('')}
            </div>
            <button onclick="startSplitStudy()" class="ios-press w-full py-3 rounded-2xl border-0 font-semibold text-[14px] text-white" style="background:linear-gradient(135deg, var(--action), var(--ai))">
              进入上下双舞台训练 ▶
            </button>
          </div>

          <!-- Tile 4 (Bottom Left): 7-Day Memory Pulse -->
          <div onclick="route='health-analytics';render()" class="ios-press bento-tile p-4 flex flex-col justify-between h-[142px]">
            <div class="text-[11px] font-bold" style="color:var(--muted)">FSRS 保持率</div>
            <div class="text-[32px] font-bold tabular-nums leading-none" style="color:var(--ok)">89%</div>
            <div class="flex items-end gap-1 h-8">
              ${[55,70,62,80,75,85,89].map(v => `<div class="flex-1 rounded-t" style="height:${v}%;background:var(--ok);opacity:0.75"></div>`).join('')}
            </div>
          </div>

          <!-- Tile 5 (Bottom Right): Quick Natural Intake -->
          <div class="bento-tile p-4 flex flex-col justify-between h-[142px]">
            <div class="text-[11px] font-bold" style="color:var(--muted)">快速添词</div>
            <div class="text-[12px] leading-snug" style="color:var(--ink)">“affect 和 effect 总写反”</div>
            <button onclick="alert('已放入 gpt-6-luna 队列整理归组')" class="ios-press w-full py-2 rounded-xl border-0 text-[12px] font-semibold" style="background:var(--action-soft);color:var(--action)">+ 立即归组</button>
          </div>
        </div>`;
    }

    // 2. SPLIT-STAGE STUDY INTERACTION (TOP FIXED PRISM INSTRUMENT + BOTTOM THUMB DECK)
    function renderSplitStage() {
      const pair = PAIR_CAROUSEL[carouselIdx];
      const revealed = !maskedMode || splitPicked !== null;
      const isOk = splitPicked === pair.answer;

      return `
        <div class="relative z-10 flex-1 flex flex-col overflow-hidden">
          <!-- UPPER STAGE (38%): Fixed Optical Prism Instrument with Frosted Mask Before Answer -->
          <div class="px-4 pt-1 pb-4 border-b flex flex-col justify-between" style="height:40%;background:var(--stage-top);backdrop-filter:blur(28px);border-color:var(--line)">
            <div class="flex items-center justify-between">
              <button onclick="route='bento';splitPicked=null;maskedMode=true;render()" class="ios-press px-3 py-1 rounded-full border-0 text-[12px] font-semibold" style="background:var(--sunk);color:var(--ink)">✕ 退出</button>
              <span class="text-[11px] font-bold px-2.5 py-1 rounded-full" style="background:var(--action-soft);color:var(--action)">上下双舞台 · ${revealed ? '光谱已解锁' : '差异已雾化遮罩'}</span>
              <button onclick="maskedMode=!maskedMode;render()" class="ios-press px-2.5 py-1 rounded-full border-0 text-[11px] font-semibold" style="background:var(--sunk);color:var(--muted)">${maskedMode ? '偷看光谱' : '恢复遮罩'}</button>
            </div>

            <!-- The Optical Instrument Well -->
            <div class="p-3.5 rounded-2xl my-auto space-y-1.5" style="background:var(--sunk)">
              ${pair.members.map((m, mi) => `
                <div class="flex items-center justify-between">
                  <div>
                    ${m.lemma.split('').map((ch, ci) => {
                      const isDiff = m.diffs.includes(ci);
                      const blurCls = isDiff && !revealed ? 'diff-char-masked' : 'diff-char-revealed';
                      return `<span class="prism-cell ${isDiff ? 'prism-beam' : ''} ${blurCls}" style="color:${isDiff && revealed ? `var(--sp-${mi})` : 'var(--ink)'}">
                        ${ch===' '?'&nbsp;':ch}
                        ${isDiff && revealed ? `<span class="prism-glow-line" style="background:var(--sp-${mi})"></span>` : ''}
                      </span>`;
                    }).join('')}
                  </div>
                  <span class="text-[12px] font-medium transition-opacity" style="color:var(--muted);opacity:${revealed ? 1 : 0.2}">${revealed ? m.gloss : '作答后揭示词义'}</span>
                </div>`).join('')}
            </div>

            <div class="text-[11px] text-center" style="color:var(--muted)">
              ${revealed ? `💡 ${pair.tip}` : '上半屏锁定棱镜对比仪器 · 下半屏单手作答后自动消融遮罩'}
            </div>
          </div>

          <!-- LOWER STAGE (60%): Ergonomic Thumb Action Zone -->
          <div class="flex-1 px-4 pt-4 pb-6 flex flex-col justify-between">
            <div class="flex gap-1.5 p-1 rounded-xl" style="background:var(--sunk)">
              <button onclick="splitStep='choice';render()" class="flex-1 py-1.5 rounded-lg text-[11px] font-semibold border-0 cursor-pointer" style="${splitStep==='choice'?'background:var(--tile-solid);color:var(--ink);':'background:transparent;color:var(--muted);'}">单手选词台</button>
              <button onclick="splitStep='production';render()" class="flex-1 py-1.5 rounded-lg text-[11px] font-semibold border-0 cursor-pointer" style="${splitStep==='production'?'background:var(--tile-solid);color:var(--ink);':'background:transparent;color:var(--muted);'}">拇指造句台</button>
            </div>

            ${splitStep === 'choice' ? `
              <div class="bento-tile p-4 my-auto">
                <div class="text-[11px] font-bold uppercase" style="color:var(--muted)">语境填空</div>
                <p class="text-[19px] font-semibold leading-relaxed mt-1.5">
                  ${pair.stem.replace('______', `<span class="px-2.5 py-0.5 rounded-lg font-mono-prism" style="background:var(--action-soft);color:var(--action)">${splitPicked || '______'}</span>`)}
                </p>
              </div>

              <div class="space-y-2">
                <div class="grid grid-cols-2 gap-2.5">
                  ${pair.options.map(o => {
                    const picked = splitPicked === o;
                    const right = splitPicked && o === pair.answer;
                    const wrong = picked && o !== pair.answer;
                    return `
                      <button onclick="splitPicked='${o}';maskedMode=false;render()" class="ios-press py-4 rounded-2xl border-0 font-bold text-[17px]"
                        style="background:${right?'var(--ok-soft)':wrong?'var(--err-soft)':'var(--tile)'};color:${right?'var(--ok)':wrong?'var(--err)':'var(--ink)'};border:1px solid ${right?'var(--ok)':wrong?'var(--err)':'var(--hairline)'}">
                        ${o}
                      </button>`;
                  }).join('')}
                </div>
                ${splitPicked ? `
                  <button onclick="carouselIdx=(carouselIdx+1)%2;splitPicked=null;maskedMode=true;render()" class="ios-press w-full py-3.5 rounded-2xl border-0 font-semibold text-[14px] text-white" style="background:${isOk?'var(--ok)':'var(--action)'}">
                    ${isOk ? '✓ 正确！切到下一组词 →' : '查看上方高亮区别 · 继续下一题 →'}
                  </button>` : ''}
              </div>
            ` : `
              <div class="bento-tile p-4 space-y-3 my-auto">
                <div class="text-[12px] font-bold" style="color:var(--ai)">✦ AI 实时造句检验</div>
                <textarea rows="3" class="w-full p-3 rounded-xl border-0 outline-none text-[14px] resize-none" style="background:var(--sunk);color:var(--ink)">The new UI shows a linear improvement in speed.</textarea>
                <div class="p-2.5 rounded-xl text-[12px]" style="background:var(--ok-soft);color:var(--ok)">✓ 精准使用了形容词 linear，与上屏对比一致。</div>
              </div>
              <button onclick="route='bento';render()" class="ios-press w-full py-3.5 rounded-2xl border-0 font-semibold text-white" style="background:var(--action)">完成并返回矩阵</button>
            `}
          </div>
        </div>`;
    }

    function renderGridLibrary() {
      return `
        <div class="grid grid-cols-2 gap-3 pb-4">
          ${[
            { w: 'linear / liner', r: '形似', c: 'var(--sp-0)', n: '3 词 · 待复习' },
            { w: 'adapt / adopt', r: '形似', c: 'var(--sp-1)', n: '3 词 · 学习中' },
            { w: 'complement', r: '音似', c: 'var(--sp-2)', n: '2 词 · 已稳定' },
            { w: 'stationery', r: '待整理', c: 'var(--sp-3)', n: '1 词 · 可 AI 归组' }
          ].map(x => `
            <div onclick="startSplitStudy()" class="ios-press bento-tile p-4 flex flex-col justify-between h-[130px]">
              <span class="self-start px-2 py-0.5 rounded-full text-[10px] font-bold" style="background:var(--sunk);color:${x.c}">${x.r}</span>
              <div class="text-[16px] font-bold leading-snug">${x.w}</div>
              <div class="text-[11px]" style="color:var(--muted)">${x.n}</div>
            </div>`).join('')}
        </div>`;
    }

    function renderHealthAnalytics() {
      const days = [24,32,18,28,12,26,14];
      return `
        <div class="space-y-3 pb-4">
          <div class="bento-tile p-4 space-y-3">
            <div class="flex justify-between items-center">
              <span class="text-[13px] font-bold">点击柱条查看单日投入</span>
              <span class="text-[14px] font-bold tabular-nums" style="color:var(--action)">${days[selectedHeatDay]} 分钟</span>
            </div>
            <div class="flex items-end gap-2 h-28 pt-2">
              ${days.map((m, i) => `
                <button onclick="selectedHeatDay=${i};render()" class="flex-1 h-full flex flex-col justify-end items-center gap-1 border-0 bg-transparent cursor-pointer p-0">
                  <div class="w-full rounded-lg transition-all" style="height:${(m/36)*100}%;background:${selectedHeatDay===i?'var(--action)':'var(--sunk)'}"></div>
                  <span class="text-[10px]" style="color:var(--muted)">D${i+1}</span>
                </button>`).join('')}
            </div>
          </div>
          <div class="bento-tile p-4 space-y-2 text-[12px]">
            <div class="font-bold text-[13px]">模型配置 · gpt-6-luna (Responses)</div>
            <div style="color:var(--muted)">Room + Rust FSRS 本地拟合正常运行，当前 30 分钟质量预算已锁定。</div>
          </div>
        </div>`;
    }

    function startSplitStudy() {
      splitPicked = null;
      maskedMode = true;
      route = 'split-study';
      render();
    }

    render();
  </script>
</body>
</html>
